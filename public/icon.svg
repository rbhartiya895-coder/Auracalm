<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14362a" />
      <stop offset="50%" stop-color="#20493b" />
      <stop offset="100%" stop-color="#2d6452" />
    </linearGradient>
    <linearGradient id="petal-center" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <linearGradient id="petal-side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Ambient Calm Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.25" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#a7f3d0" stroke-width="2" opacity="0.35" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.45" />

  <!-- Lotus / Sanctuary Flower Icon -->
  <g filter="url(#glow)">
    <!-- Base Ripples -->
    <path d="M176 340 C 210 360, 302 360, 336 340 C 310 348, 202 348, 176 340 Z" fill="#6ee7b7" opacity="0.7" />

    <!-- Left Outer Petal -->
    <path d="M256 320 C 180 310, 140 240, 160 190 C 200 230, 240 280, 256 320 Z" fill="url(#petal-side)" opacity="0.85" />
    
    <!-- Right Outer Petal -->
    <path d="M256 320 C 332 310, 372 240, 352 190 C 312 230, 272 280, 256 320 Z" fill="url(#petal-side)" opacity="0.85" />

    <!-- Left Inner Petal -->
    <path d="M256 320 C 200 290, 180 210, 210 160 C 235 210, 250 270, 256 320 Z" fill="url(#petal-center)" opacity="0.9" />

    <!-- Right Inner Petal -->
    <path d="M256 320 C 312 290, 332 210, 302 160 C 277 210, 262 270, 256 320 Z" fill="url(#petal-center)" opacity="0.9" />

    <!-- Center Lotus Core Petal -->
    <path d="M256 324 C 236 260, 236 180, 256 130 C 276 180, 276 260, 256 324 Z" fill="url(#petal-center)" />

    <!-- Core Golden Pearl of Serenity -->
    <circle cx="256" cy="270" r="12" fill="#fde68a" />
  </g>
</svg>
